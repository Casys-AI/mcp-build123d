name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build123d (cad tools backend)
        run: pip install build123d==0.11.1

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts server.ts

      - name: Run tests
        run: deno test --allow-all tests/

      - name: Validate JSR package
        run: deno publish --dry-run

  publish-jsr:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: publish-jsr-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify release tag matches deno.json
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(deno run --allow-read scripts/release-guard.ts tag "$RELEASE_REF")"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Detect an already-published JSR version
        id: jsr
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          decision="$(deno run --allow-read --allow-net scripts/release-guard.ts published "$RELEASE_VERSION")"
          case "$decision" in
            already-published|publish) ;;
            *)
              echo "::error title=Unknown JSR release decision::$decision"
              exit 1
              ;;
          esac
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Release version already exists
        if: ${{ steps.jsr.outputs.decision == 'already-published' }}
        run: echo "::notice title=JSR release unchanged::Matching version already exists; skipping upload."

      - name: Publish to JSR
        if: ${{ steps.jsr.outputs.decision == 'publish' }}
        run: deno publish
